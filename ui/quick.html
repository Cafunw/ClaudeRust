<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quick Entry</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="quick">
  <div class="quick-box">
    <svg width="22" height="22" viewBox="0 0 24 24" style="color:var(--accent)"><path fill="currentColor" d="M12 1.5c.6 5.6 3.4 9 10.5 10.5C15.4 13.4 12.6 16.8 12 22.5 11.4 16.8 8.6 13.4 1.5 12 8.6 10.5 11.4 7.1 12 1.5z"/></svg>
    <textarea id="q" rows="1" placeholder="How can I help you today?"></textarea>
    <button class="send-btn" id="go" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
  <div class="quick-hint">Enter ↵ · Esc</div>
  <script type="module" src="js/quick.js"></script>
</body>
</html>
