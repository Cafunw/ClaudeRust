name: Release

# Push a tag like v0.2.0 (after raising the version in tauri.conf.json and
# Cargo.toml) to make a draft GitHub release with the installers and the
# signed update manifest (latest.json). Publishing the draft makes it the
# "latest" release, which installed apps then offer as an update.
#
# The signing key can push updates to every installed copy, so it lives in
# a protected environment rather than in repository secrets:
#   Settings → Environments → New environment "release"
#     Deployment branches and tags: Selected → add the tag rule "v*"
#     (optional) Required reviewers: you, to approve each release run
#     Environment secrets:
#       TAURI_SIGNING_PRIVATE_KEY           the updater signing key (file contents)
#       TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# The job runs only for v* tags (also when started by hand), without a build
# cache and with no third-party action except Tauri's own.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the signing key is set
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets of the \"release\" environment (see the top of release.yml)."
            exit 1
          fi
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$RUNNER_OS" = "macOS" ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - name: Install Tauri CLI
        run: npm ci --ignore-scripts
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ClaudeRust ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below."
          releaseDraft: true
          prerelease: false
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          # latest.json for the in-app updater (Windows updates use the NSIS installer)
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
