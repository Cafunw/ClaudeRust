name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build tests
        run: cargo test -p clauderust --lib --no-run
      - name: Unit tests
        timeout-minutes: 5
        run: cargo test -p clauderust --lib -- --test-threads=2
      - name: Check UI modules parse
        run: for f in ui/js/*.js; do node --experimental-default-type=module --check "$f"; done
