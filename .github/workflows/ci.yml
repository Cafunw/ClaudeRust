name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build tests
        run: cargo test -p clauderust --lib --no-run
      - name: Unit tests
        timeout-minutes: 10
        run: cargo test -p clauderust --lib -- --test-threads=2
      - name: Clippy
        run: cargo clippy -p clauderust --lib -- -D warnings
      - name: Check UI modules parse
        if: runner.os == 'Linux'
        run: for f in ui/js/*.js ui/js/panes/*.js; do node --experimental-default-type=module --check "$f"; done
      - name: Lint UI (undefined names, duplicate keys)
        if: runner.os == 'Linux'
        run: npm ci --ignore-scripts && npx eslint ui/js
