name: CI

on:
  push:
    # not tags: a release tag points at a commit CI has already run on
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# a newer push to the same branch (or pull request) replaces the run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build tests
        run: cargo test -p clauderust --no-default-features --no-run
      # unit, integration (src-tauri/tests) and doc tests
      - name: Tests
        timeout-minutes: 15
        run: cargo test -p clauderust --no-default-features -- --test-threads=2
      - name: Clippy
        run: cargo clippy -p clauderust --no-default-features --all-targets -- -D warnings

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # what the UI tests are written and run with locally
          node-version: 26
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      # undefined names, duplicate keys, syntax errors
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ui

  # the end-to-end UI suite (ui/e2e), driven over the WebView2 debugging port
  # of a dev copy of the app: Windows only
  # informational until its first green run: on the runner the WebView2 debugging port never opens (see the log of the failing step)
  e2e:
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # a dev build: its own cache, apart from the test job's
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - name: Install
        run: npm ci --ignore-scripts
      # builds and starts the dev copy (e2e identifier, test key, no user
      # hooks), runs the suite, and stops the copy
      - name: End-to-end tests
        run: node ui/e2e/run.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs
          path: target/e2e/
          if-no-files-found: ignore
