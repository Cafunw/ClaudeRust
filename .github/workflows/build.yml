name: Build installers

# Builds installers for every platform on each push so they can be
# downloaded from the workflow run's "Artifacts" section.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows-x64
            args: ""
            bundle: target/release/bundle
          - platform: macos-latest
            name: macos-universal
            args: "--target universal-apple-darwin"
            bundle: target/universal-apple-darwin/release/bundle
          - platform: ubuntu-22.04
            name: linux-x64
            args: ""
            bundle: target/release/bundle
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Install Tauri CLI
        run: npm install
      # test installers: no update manifests or signatures (those need the
      # signing key and are made by the Release workflow)
      - name: Build
        run: npx tauri build ${{ matrix.args }} --config src-tauri/tauri.no-updater.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeRust-${{ matrix.name }}
          path: |
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage
          if-no-files-found: warn
