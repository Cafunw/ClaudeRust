[package]
name = "clauderust"
version = "0.1.9"
description = "An unofficial, lightweight desktop client for the Claude API, written in Rust"
license = "MIT"
repository = "https://github.com/Cafunw/ClaudeRust"
edition = "2021"
rust-version = "1.91"

[lib]
name = "clauderust_lib"
# Desktop only: the app binary links the rlib. ("staticlib" and "cdylib" are
# for iOS and Android builds; each was a full extra LTO link per release
# build, and the staticlib alone ~450 MB on disk.)
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
# deep-link: a second launch hands its clauderust:// URL to the running window
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "http2", "charset"] }
rusqlite = { version = "0.32", features = ["bundled"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = { version = "5", default-features = false, features = ["html", "regex-fancy", "parsing"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.23"
thiserror = "2"
dirs = "7"
regex = "1"
globset = "0.4"
ignore = "0.4"
similar = "2"
html2text = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
log = { version = "0.4", features = ["std"] }
parking_lot = "0.12"
shell-words = "1"
which = "7"
sha2 = "0.10"
hex = "0.4"
url = "2"
mime_guess = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# already in the tree through zip: inflates a PDF's object streams to count its pages
flate2 = "1"
# in the tree already (reqwest): an RTF file's \'hh bytes in its code page (office.rs)
encoding_rs = "0.8"
# in the tree already (reqwest's rustls, the updater): .mcpb signatures (extension_sign.rs), the Node.js archive (node_runtime.rs)
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
tar = { version = "0.4", default-features = false }
portable-pty = "0.9"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# the job object that ends child processes with the app (jobobject.rs); 0.59 is in the tree already
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# which program handles clauderust:// links (deeplink.rs); in the tree already through tauri-plugin-deep-link
windows-registry = "0.6"
# in the tree already through wry: WebView2's memory target while the window is hidden (webview_memory.rs)
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
# MockRuntime for tests of code that emits events
tauri = { version = "2", features = ["test"] }
